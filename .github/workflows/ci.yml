name: Docker CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Скачиваем код репозитория на раннер
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем Docker Buildx (современный стандарт сборки с кэшированием)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Собираем Docker-образ
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                # Контекст сборки - корень репозитория
          file: ./Dockerfile        # Путь к нашему Dockerfile
          push: false               # Пока только собираем и проверяем, не отправляем в реестр
          tags: react-app:ci-test   # Тег для образа
          load: true                # Загружаем образ в локальный Docker раннера для проверки